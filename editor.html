<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>更新履歴エディタ</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { overflow: auto; -webkit-user-select: text; user-select: text; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input[type=text], input[type=date], textarea {
      width: 100%; background: #0009; color: var(--text); border: 2px solid var(--line);
      font-family: inherit; font-size: 15px; padding: 8px; -webkit-user-select: text; user-select: text;
    }
    textarea { min-height: 110px; }
    #out { font-family: monospace; font-size: 12px; min-height: 220px; }
    .entry-row { display: flex; align-items: flex-start; gap: 8px; }
    .entry-row .log-entry { flex: 1; margin: 6px 0; }
    ol { padding-left: 20px; font-size: 13px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="logo" style="font-size:22px">更新履歴エディタ</h1>
    <p class="muted">ここで書いた内容がゲーム内の「更新履歴」と「お知らせ」ポップアップに表示されます。このページはゲーム内からはリンクされていません。</p>

    <div class="panel">
      <h3>新しい項目を追加</h3>
      <label>バージョン（コードを変えていない「お知らせだけ」の場合は空欄でOK）</label>
      <input type="text" id="f-version" placeholder="例: 0.2.0">
      <label>日付</label>
      <input type="date" id="f-date">
      <label>タイトル</label>
      <input type="text" id="f-title" placeholder="例: 新キャラ追加＆バランス調整">
      <label>内容（1行に1項目）</label>
      <textarea id="f-items" placeholder="新キャラ「ミラ」を追加&#10;ボスのHPを10%下げました"></textarea>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="f-notify" checked> 通知をオンにしているプレイヤーにプッシュ通知を送る</label>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="add">追加する</button></div>
    </div>

    <div class="panel">
      <h3>現在の更新履歴</h3>
      <div id="list"><p class="muted">読み込み中…</p></div>
    </div>

    <div class="panel">
      <h3>保存のしかた</h3>
      <ol>
        <li>下の「JSONをコピー」を押す</li>
        <li>「GitHubで開く」を押す（GitHubにログインした状態で）</li>
        <li>中身をすべて消して貼り付け →「Commit changes」</li>
        <li>数分後にゲームへ反映。通知にチェックがあればプッシュ通知も届きます</li>
      </ol>
      <textarea id="out" readonly></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn cyan" id="copy">JSONをコピー</button>
        <a class="btn" id="gh" target="_blank" rel="noopener" style="text-decoration:none">GitHubで開く</a>
      </div>
      <p class="muted" id="gh-note"></p>
    </div>
  </div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
